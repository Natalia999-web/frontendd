  <ellipse cx="32" cy="32" rx="19" ry="6" fill="#7cb342" transform="rotate(-30 32 32)"/>
  <ellipse cx="32" cy="30" rx="14" ry="4.5" fill="#9ccc65" transform="rotate(-30 32 30)"/>
  <!-- Nervio central de la hoja -->
  <line x1="14" y1="50" x2="52" y2="16" stroke="#33691e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Letra T -->
  <rect x="22" y="10" width="20" height="4" rx="2" fill="#f9a825"/>
  <rect x="30" y="10" width="4" height="18" rx="2" fill="#f9a825"/>
