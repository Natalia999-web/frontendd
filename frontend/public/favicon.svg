<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo verde oscuro -->
  <rect width="64" height="64" rx="12" fill="#1b5e20"/>
  <!-- Hoja de plátano -->
